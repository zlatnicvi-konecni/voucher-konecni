<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher – Zlatnická dílna Koneční</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #666;
    }

    .qr-area {
      text-align: center;
      margin-top: 25px;
    }

    #qrcode img,
    #qrcode canvas {
      margin: auto;
    }

    .voucher-code {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      margin-top: 15px;
      word-break: break-word;
    }

    .note {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 12px;
    }

    @media print {
      body {
        background: white;
      }

      .no-print {
        display: none !important;
      }

      .container {
        margin: 0;
        padding: 0;
      }

      .card {
        box-shadow: none;
      }
    }
  </style>

  <!-- QR knihovna -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.min.js"></script>
</head>

<body>

<div class="container">

  <div class="card no-print">
    <h1>Voucher<br>Zlatnická dílna Koneční</h1>

    <h2>QR kód</h2>

    <label for="voucherCode">
      Kód voucheru
    </label>

    <input
      id="voucherCode"
      type="text"
      placeholder="Např. ZK-J924-VYQW-JWFD"
      autocomplete="off"
    >

    <button onclick="generateQR()">
      Vytvořit QR kód
    </button>

    <button class="secondary" onclick="window.print()">
      Tisk QR kódu
    </button>
  </div>

  <div class="card">
    <div id="qrcode" class="qr-area"></div>
    <div id="displayCode" class="voucher-code"></div>

    <div class="note">
      QR kód je vytvořen přímo v tomto prohlížeči.
    </div>
  </div>

</div>

<script>
  function generateQR() {
    const input = document.getElementById("voucherCode");
    const code = input.value.trim();

    if (!code) {
      alert("Zadej nejdříve kód voucheru.");
      return;
    }

    const qrContainer = document.getElementById("qrcode");
    const displayCode = document.getElementById("displayCode");

    qrContainer.innerHTML = "";
    displayCode.textContent = code;

    try {
      const qr = qrcode(0, "M");
      qr.addData(code);
      qr.make();

      qrContainer.innerHTML = qr.createImgTag(6, 16);

    } catch (error) {
      console.error(error);
      alert("QR kód se nepodařilo vytvořit.");
    }
  }
</script>

</body>
</html>
